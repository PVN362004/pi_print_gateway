[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-print-gateway"
version = "1.0.0"
description = "Configurable Raspberry Pi print automation gateway"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "PyYAML>=6,<7",
  "requests>=2.31,<3",
  "paho-mqtt>=2,<3",
]
